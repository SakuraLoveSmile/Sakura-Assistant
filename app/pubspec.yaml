name: assistant
description: "个人助手客户端：设备监控、Feedback 消息与故障队列。"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理（定型：Riverpod 3.x，不混用 provider）
  flutter_riverpod: 3.3.2
  # 路由 + 通知跳转
  go_router: 17.5.0
  # REST 客户端（SSE 流式通道在原生侧，不经 Dart）
  http: 1.6.0
  # Dart 侧历史缓存 assistant_cache.db
  sqflite: 2.4.2+1
  # token 存放（Keystore/Keychain 后端）
  flutter_secure_storage: 11.2.0
  # 手机断网 vs 中枢不可达区分
  connectivity_plus: 7.3.1
  # 中文 UI / 时间格式
  intl: 0.20.2
  # 趋势折线图（契约允许的 chart 选型）
  fl_chart: 1.2.0
  # hubUrl 等非敏感偏好
  shared_preferences: 2.5.5
  # 反馈提交组件（登录/截图遮挡/日志附件由组件实现），固定到 Feedback v0.6.0 发布提交
  feedback_widget:
    git:
      url: https://github.com/SakuraLoveSmile/Sakura-Feedback.git
      path: flutter/feedback
      ref: 3114c04f1982c5ab7ca7402082679c0aceee4db9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 纯 Dart 环境跑 sqflite（assistant_cache 的单元测试）
  sqflite_common_ffi: 2.4.0+3

flutter:
  uses-material-design: true
